name: Push (other branches)

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build image
    uses: ./.github/workflows/build_image.yaml
    secrets: inherit

  tests:
    name: Run tests
    uses: ./.github/workflows/run_tests.yaml
    needs:
      - build
